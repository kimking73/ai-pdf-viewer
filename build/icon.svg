  <g fill="#9db4cc">
    <rect x="330" y="300" width="210" height="28" rx="14"/>
    <rect x="330" y="384" width="330" height="28" rx="14"/>
    <rect x="330" y="468" width="330" height="28" rx="14"/>
  </g>
  <!-- 튜터의 말풍선 -->
