    <path d="M496 556 h302 a56 56 0 0 1 56 56 v128 a56 56 0 0 1 -56 56 h-176 l-82 72 v-72 h-44 a56 56 0 0 1 -56 -56 v-128 a56 56 0 0 1 56 -56 z" fill="#ffb020"/>
