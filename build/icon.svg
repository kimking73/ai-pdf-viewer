<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8cf0"/>
      <stop offset="1" stop-color="#0058b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00264f" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- macOS 아이콘 격자: 1024 안에 824 크기의 둥근 사각형 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- 쪽 -->
  <g filter="url(#shadow)">
    <path d="M292 214 h300 l140 140 v434 a24 24 0 0 1 -24 24 h-416 a24 24 0 0 1 -24 -24 v-550 a24 24 0 0 1 24 -24 z" fill="#ffffff"/>
